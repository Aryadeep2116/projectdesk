<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectDesk — Find your next resume project</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --paper:#0F1310;
    --paper-2:#171C18;
    --ink:#EDEFEA;
    --ink-soft:#8B948A;
    --line:#2A322C;
    --accent:#D4F26A;
    --accent-2:#6E8DFF;
    --card:#151A16;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background: var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:0;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  .bg-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
    z-index:0;
  }
  .bg-orb.one{
    width:420px;height:420px;
    top:-120px;left:-100px;
    background:rgba(212,242,106,0.09);
    animation:floatA 18s ease-in-out infinite;
  }
  .bg-orb.two{
    width:380px;height:380px;
    bottom:-140px;right:-100px;
    background:rgba(110,141,255,0.08);
    animation:floatB 22s ease-in-out infinite;
  }
  @keyframes floatA{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(40px,60px);}
  }
  @keyframes floatB{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-50px,-30px);}
  }
  .shape{
    position:absolute;
    pointer-events:none;
    z-index:-1;
  }
  .shape.circle{
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid var(--accent);
    animation:floatShape 3.5s ease-in-out infinite;
  }
  .shape.plus{
    font-family:'JetBrains Mono', monospace;
    font-size:26px;
    color:var(--accent-2);
    animation:floatShape 4.2s ease-in-out infinite .3s;
  }
  @keyframes floatShape{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-10px) rotate(12deg);}
  }
  @keyframes heroIn{
    from{opacity:0;transform:translateY(24px) scale(.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--accent);
    background:rgba(212,242,106,0.08);
    border:1px solid rgba(212,242,106,0.25);
    padding:7px 14px;
    border-radius:20px;
  }
  .eyebrow::before{content:'●';font-size:8px;}

  .landing{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 22px;
    position:relative;
    z-index:1;
  }
  .land-badge{margin-bottom:26px;}
  .land-h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(42px, 10vw, 76px);
    line-height:1.02;
    letter-spacing:-2.5px;
    margin:0 0 22px;
    opacity:0;
    animation:heroIn .9s cubic-bezier(.2,.9,.25,1.1) .1s forwards;
  }
  .land-h1 .line{display:block;}
  .land-h1 em{
    font-style:normal;
    color:var(--accent);
  }
  .land-sub{
    font-size:18px;
    color:var(--ink-soft);
    max-width:480px;
    line-height:1.6;
    margin:0 0 40px;
    opacity:0;
    animation:riseIn .8s ease .35s forwards;
  }
  .cta-btn{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:1px;
    text-transform:uppercase;
    font-size:14.5px;
    font-weight:600;
    background:var(--accent);
    color:#0F1310;
    border:none;
    padding:20px 36px;
    border-radius:8px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:12px;
    position:relative;
    overflow:hidden;
    opacity:0;
    animation:riseIn .8s ease .5s forwards, ctaPulse 2.5s ease-in-out 2s infinite;
    transition:transform .2s ease, box-shadow .2s ease;
    text-decoration:none;
  }
  @keyframes ctaPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(212,242,106,0.4);}
    50%{box-shadow:0 0 0 14px rgba(212,242,106,0);}
  }
  .cta-btn:hover{transform:translateY(-2px) scale(1.03);}
  .cta-btn::after{
    content:'';
    position:absolute;
    top:0;left:-120%;
    width:60%;height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform:skewX(-20deg);
    transition:left .5s ease;
  }
  .cta-btn:hover::after{left:130%;}
  .cta-btn .btn-arrow{transition:transform .25s ease;}
  .cta-btn:hover .btn-arrow{transform:translateX(5px);}
  .land-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:.5px;
    color:var(--ink-soft);
    margin-top:20px;
    opacity:0;
    animation:riseIn .8s ease .65s forwards;
  }
  .land-shape-1{top:15%;left:12%;}
  .land-shape-2{top:22%;right:14%;}
  .land-shape-3{
    position:absolute;
    bottom:18%;left:18%;
    color:var(--accent-2);
    font-size:20px;
    animation:floatShape 5s ease-in-out infinite .6s;
  }

  @media (max-width:560px){
    .land-h1{letter-spacing:-1.5px;}
    .land-sub{font-size:15.5px;}
    .cta-btn{padding:17px 24px;font-size:13px;text-align:center;}
    .land-shape-1, .land-shape-2, .land-shape-3{display:none;}
  }
</style>
</head>
<body>
<div class="bg-orb one"></div>
<div class="bg-orb two"></div>

<section class="landing" id="landing">
  <span class="shape circle land-shape-1"></span>
  <span class="shape plus land-shape-2">+</span>
  <span class="shape land-shape-3">✦</span>
  <div class="eyebrow land-badge">Free · Built for students</div>
  <h1 class="land-h1"><span class="line">Stop guessing</span><span class="line">what to <em>build.</em></span></h1>
  <p class="land-sub">Get project ideas matched to the role you actually want — not another generic list you'll scroll past. Takes 30 seconds.</p>
  <a href="app.html" id="cta-btn" class="cta-btn">Build Projects For My Resume <span class="btn-arrow">→</span></a>
  <div class="land-meta">Free to start · Sign up in seconds · 360 credits every month</div>
</section>

<script>
const WORKER_URL = "https://projectdesk-api.aryadeepbiswas014.workers.dev";

// Track landing page view (fire and forget, don't block anything on it)
fetch(WORKER_URL, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ action: 'track', type: 'landing_view' })
}).catch(() => {});

document.getElementById('cta-btn').addEventListener('click', () => {
  fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'track', type: 'cta_click' })
  }).catch(() => {});
  // Navigation to app.html happens natively via the href — no need to preventDefault.
});
</script>
</body>
</html>
