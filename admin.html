<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildItUp — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#FFFFFF;
    --paper-2:#F7F8FA;
    --ink:#0B0F0D;
    --ink-soft:#5B6B63;
    --line:#E7EAE7;
    --accent:#0EA968;
    --accent-2:#1D4ED8;
    --card:#FFFFFF;
    --error:#DC2626;
  }

  /* ---------- ANIMATED BRAND MARK ---------- */
  .brand-mark{display:inline-flex;align-items:center;gap:10px;}
  .brand-blocks{position:relative;width:22px;height:22px;flex-shrink:0;}
  .brand-blocks .blk{position:absolute;width:9px;height:9px;border-radius:3px;opacity:0;transform:translateY(6px) scale(0.6);animation:blockIn .5s cubic-bezier(.2,.8,.3,1.2) forwards;}
  .brand-blocks .blk1{left:0;bottom:0;background:#087F4E;animation-delay:.05s;}
  .brand-blocks .blk2{left:7px;bottom:5px;background:#0EA968;animation-delay:.18s;}
  .brand-blocks .blk3{left:14px;bottom:10px;background:#1D4ED8;animation-delay:.31s;}
  @keyframes blockIn{to{opacity:1;transform:translateY(0) scale(1);}}
  .brand-text{
    background:linear-gradient(100deg, var(--ink) 0%, #087F4E 35%, #1D4ED8 65%, var(--ink) 100%);
    background-size:220% auto;
    background-position:15% center;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand-text .bl{display:inline-block;opacity:0;transform:translateY(10px);animation:letterIn .5s ease forwards;}
  .brand-mark:hover .brand-text{animation:shimmerSweep 1.4s linear infinite;}
  @keyframes shimmerSweep{to{background-position:-205% center;}}
  @keyframes letterIn{to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .brand-blocks .blk, .brand-text .bl{animation:none !important; opacity:1 !important; transform:none !important;}
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:0;
  }
  .wrap{max-width:960px;margin:0 auto;padding:48px 22px 100px;}

  /* HEADER */
  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:36px;}
  h1{
    font-family:'Sora', sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.3px;
  }
  h1 span{color:var(--accent);}
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }
  #logout{
    display:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
    transition:.2s;
  }
  #logout:hover{border-color:var(--accent);color:var(--accent);}

  /* LOGIN CARD */
  .login-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px;
    max-width:420px;
    margin:0 auto;
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .login-card h2{
    font-family:'Sora', sans-serif;
    font-size:18px;
    margin:0 0 6px;
  }
  .login-card p{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 22px;
    line-height:1.5;
  }
  .pw-row{position:relative;margin-bottom:14px;}
  input[type="password"], input[type="text"]{
    width:100%;
    padding:13px 44px 13px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .2s;
  }
  input:focus{border-color:var(--accent);}
  input::placeholder{color:var(--ink-soft);}
  .toggle-eye{
    position:absolute;
    right:12px;top:50%;
    transform:translateY(-50%);
    background:none;border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
    padding:4px;
  }
  .toggle-eye:hover{color:var(--accent);}
  .remember-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }
  .remember-row input{width:auto;padding:0;accent-color:var(--accent);}
  button.primary{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#FFFFFF;
    font-weight:600;
    font-size:14px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  button.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(14,169,104,0.18);}
  button.primary:active{transform:translateY(0);}
  button.primary:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
  .error-msg{
    color:var(--error);
    font-size:13px;
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* DASHBOARD */
  #dashboard{display:none;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:32px;}
  .stat-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    transition:border-color .2s;
  }
  .stat-box:hover{border-color:var(--accent-2);}
  .stat-box .num{
    font-family:'Sora', sans-serif;
    font-size:30px;
    font-weight:700;
    color:var(--accent);
  }
  .stat-box .lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .table-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .table-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .table-head h3{
    font-family:'Sora', sans-serif;
    font-size:15px;
    margin:0;
  }
  #search{
    max-width:220px;
    padding:9px 12px;
    font-size:12.5px;
  }
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:12px 20px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:1px;
    font-weight:600;
    background:var(--paper-2);
  }
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(14,169,104,0.03);}
  td.email{color:var(--accent);font-family:'IBM Plex Mono', monospace;font-size:12px;}
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .dot-pulse{
    display:inline-block;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.3;}
    50%{opacity:1;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1 class="brand-mark">
        <span class="brand-blocks"><span class="blk blk1"></span><span class="blk blk2"></span><span class="blk blk3"></span></span>
        <span class="brand-text"><span class="bl" style="animation-delay:.05s">B</span><span class="bl" style="animation-delay:.08s">u</span><span class="bl" style="animation-delay:.11s">i</span><span class="bl" style="animation-delay:.14s">l</span><span class="bl" style="animation-delay:.17s">d</span><span class="bl" style="animation-delay:.20s">I</span><span class="bl" style="animation-delay:.23s">t</span><span class="bl" style="animation-delay:.26s">U</span><span class="bl" style="animation-delay:.29s">p</span></span>
        <span>/ Admin</span>
      </h1>
      <div class="tag">Waitlist &amp; engagement dashboard</div>
    </div>
    <button id="logout">Log out</button>
  </div>

  <!-- LOGIN -->
  <div class="login-card" id="loginCard">
    <h2>Enter admin password</h2>
    <p>Access to waitlist signups and site analytics. This page isn't linked publicly.</p>
    <div class="pw-row">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="off">
      <button class="toggle-eye" id="toggleEye" type="button">show</button>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="remember">
      <label for="remember">Keep me signed in on this device</label>
    </div>
    <button class="primary" id="load">Load dashboard</button>
    <div id="msg"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="stats" id="statsRow"></div>
    <div class="table-card">
      <div class="table-head">
        <h3>Waitlist signups</h3>
        <input id="search" type="text" placeholder="Search email or role...">
      </div>
      <div class="table-scroll" id="tableWrap"></div>
    </div>
  </div>

</div>

<script>
const WORKER_URL = "https://projectdesk-api.aryadeepbiswas014.workers.dev";
let allEntries = [];

const pwInput = document.getElementById('pw');
const loadBtn = document.getElementById('load');
const msg = document.getElementById('msg');
const loginCard = document.getElementById('loginCard');
const dashboard = document.getElementById('dashboard');
const logoutBtn = document.getElementById('logout');
const toggleEye = document.getElementById('toggleEye');
const searchInput = document.getElementById('search');

toggleEye.addEventListener('click', () => {
  const showing = pwInput.type === 'text';
  pwInput.type = showing ? 'password' : 'text';
  toggleEye.textContent = showing ? 'show' : 'hide';
});

pwInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadBtn.click();
});

async function loadDashboard(password) {
  msg.innerHTML = '<div class="error-msg" style="color:var(--ink-soft);"><span class="dot-pulse">●</span> Authenticating...</div>';
  loadBtn.disabled = true;

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin_view_waitlist', password })
    });
    const data = await res.json();

    if (data.error) {
      msg.innerHTML = `<div class="error-msg">⚠ ${data.error}</div>`;
      loadBtn.disabled = false;
      sessionStorage.removeItem('pd_admin_pw');
      localStorage.removeItem('pd_admin_pw');
      return;
    }

    if (document.getElementById('remember').checked) {
      localStorage.setItem('pd_admin_pw', password);
    } else {
      sessionStorage.setItem('pd_admin_pw', password);
    }

    msg.innerHTML = '';
    loadBtn.disabled = false;
    renderDashboard(data);
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
  } catch (err) {
    msg.innerHTML = '<div class="error-msg">⚠ Could not reach the server. Try again.</div>';
    loadBtn.disabled = false;
  }
}

function renderDashboard(data) {
  const entries = data.entries || [];
  allEntries = entries;
  const counts = data.eventCounts || {};
  const views = counts.landing_view || 0;
  const clicks = counts.cta_click || 0;
  const rate = views ? ((clicks / views) * 100).toFixed(1) : '0';

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="num">${views}</div><div class="lbl">Landing views</div></div>
    <div class="stat-box"><div class="num">${clicks}</div><div class="lbl">CTA clicks</div></div>
    <div class="stat-box"><div class="num">${rate}%</div><div class="lbl">Click-through rate</div></div>
    <div class="stat-box"><div class="num">${entries.length}</div><div class="lbl">Waitlist signups</div></div>
  `;

  renderTable(entries);
}

function renderTable(entries) {
  const tableWrap = document.getElementById('tableWrap');
  if (entries.length === 0) {
    tableWrap.innerHTML = '<div class="empty-state">No matching signups yet.</div>';
    return;
  }
  let html = '<table><tr><th>When</th><th>Email</th><th>Role</th><th>Gap</th><th>Dream Target</th><th>Branch</th><th>Skills</th></tr>';
  entries.forEach(e => {
    html += `<tr>
      <td>${new Date(e.ts).toLocaleString()}</td>
      <td class="email">${e.email || ''}</td>
      <td>${e.role || ''}</td>
      <td>${e.gap || ''}</td>
      <td>${e.dreamTarget || ''}</td>
      <td>${e.branch || ''}</td>
      <td>${e.skills || ''}</td>
    </tr>`;
  });
  html += '</table>';
  tableWrap.innerHTML = html;
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { renderTable(allEntries); return; }
  const filtered = allEntries.filter(e =>
    (e.email || '').toLowerCase().includes(q) ||
    (e.role || '').toLowerCase().includes(q)
  );
  renderTable(filtered);
});

loadBtn.addEventListener('click', () => {
  const password = pwInput.value;
  if (!password) {
    msg.innerHTML = '<div class="error-msg">⚠ Enter a password first.</div>';
    return;
  }
  loadDashboard(password);
});

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('pd_admin_pw');
  localStorage.removeItem('pd_admin_pw');
  dashboard.style.display = 'none';
  loginCard.style.display = 'block';
  logoutBtn.style.display = 'none';
  pwInput.value = '';
});

// Auto-login if a saved password exists
const savedPw = localStorage.getItem('pd_admin_pw') || sessionStorage.getItem('pd_admin_pw');
if (savedPw) {
  pwInput.value = savedPw;
  loadDashboard(savedPw);
}
</script>
</body>
</html>
