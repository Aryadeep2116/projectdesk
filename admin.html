<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildItUp — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#FFFFFF;
    --paper-2:#F7F8FA;
    --ink:#0B0F0D;
    --ink-soft:#5B6B63;
    --line:#E7EAE7;
    --accent:#0EA968;
    --accent-2:#1D4ED8;
    --card:#FFFFFF;
    --error:#DC2626;
  }

  /* ---------- BRAND MARK ---------- */
  .brand-mark{display:inline-flex;align-items:center;gap:10px;}
  .brand-badge{
    position:relative;width:28px;height:28px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg, var(--accent,#0EA968) 0%, #087F4E 50%, var(--accent-2,#1D4ED8) 100%);
    box-shadow:0 2px 10px rgba(14,169,104,.28), inset 0 1px 0 rgba(255,255,255,.28);
    opacity:0;transform:translateY(4px) scale(.9);
    animation:badgeIn .5s cubic-bezier(.2,.8,.3,1.2) .05s forwards;
    transition:transform .35s cubic-bezier(.2,.8,.3,1.2), box-shadow .35s;
  }
  @keyframes badgeIn{to{opacity:1;transform:translateY(0) scale(1);}}
  .brand-badge svg{width:15px;height:15px;position:relative;z-index:1;}
  .brand-mark:hover .brand-badge{
    transform:scale(1.08) rotate(-4deg);
    box-shadow:0 6px 18px rgba(14,169,104,.4), inset 0 1px 0 rgba(255,255,255,.32);
  }
  .brand-text{
    font-weight:700;
    color:var(--ink);
    opacity:0;transform:translateY(6px);
    animation:textIn .5s ease .18s forwards;
  }
  @keyframes textIn{to{opacity:1;transform:translateY(0);}}
  .brand-text .accent{
    background:linear-gradient(100deg, #087F4E 0%, var(--accent-2,#1D4ED8) 100%);
    background-size:200% auto;background-position:0 center;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;
    transition:background-position .6s ease;
  }
  .brand-mark:hover .brand-text .accent{background-position:-100% center;}
  .brand-suffix{color:var(--ink-soft);font-weight:500;margin-left:1px;}
  @media (prefers-reduced-motion: reduce){
    .brand-badge, .brand-text{animation:none !important; opacity:1 !important; transform:none !important;}
    .brand-mark:hover .brand-badge{transform:none;}
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:0;
  }
  .wrap{max-width:960px;margin:0 auto;padding:48px 22px 100px;}

  /* HEADER */
  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:36px;}
  h1{
    font-family:'Sora', sans-serif;
    font-size:26px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.3px;
  }
  h1 span{color:var(--accent);}
  .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }
  #logout{
    display:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
    transition:.2s;
  }
  #logout:hover{border-color:var(--accent);color:var(--accent);}

  /* LOGIN CARD */
  .login-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px;
    max-width:420px;
    margin:0 auto;
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .login-card h2{
    font-family:'Sora', sans-serif;
    font-size:18px;
    margin:0 0 6px;
  }
  .login-card p{
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 22px;
    line-height:1.5;
  }
  .pw-row{position:relative;margin-bottom:14px;}
  input[type="password"], input[type="text"]{
    width:100%;
    padding:13px 44px 13px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .2s;
  }
  input:focus{border-color:var(--accent);}
  input::placeholder{color:var(--ink-soft);}
  .toggle-eye{
    position:absolute;
    right:12px;top:50%;
    transform:translateY(-50%);
    background:none;border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
    padding:4px;
  }
  .toggle-eye:hover{color:var(--accent);}
  .remember-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }
  .remember-row input{width:auto;padding:0;accent-color:var(--accent);}
  button.primary{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:none;
    background:var(--accent);
    color:#FFFFFF;
    font-weight:600;
    font-size:14px;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  button.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(14,169,104,0.18);}
  button.primary:active{transform:translateY(0);}
  button.primary:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none;}
  .error-msg{
    color:var(--error);
    font-size:13px;
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* DASHBOARD */
  #dashboard{display:none;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:32px;}
  .stat-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    transition:border-color .2s;
  }
  .stat-box:hover{border-color:var(--accent-2);}
  .stat-box .num{
    font-family:'Sora', sans-serif;
    font-size:30px;
    font-weight:700;
    color:var(--accent);
  }
  .stat-box .lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .table-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .table-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .table-head h3{
    font-family:'Sora', sans-serif;
    font-size:15px;
    margin:0;
  }
  #search{
    max-width:220px;
    padding:9px 12px;
    font-size:12.5px;
  }
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:12px 20px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    text-transform:uppercase;
    font-size:10.5px;
    letter-spacing:1px;
    font-weight:600;
    background:var(--paper-2);
  }
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(14,169,104,0.03);}
  td.email{color:var(--accent);font-family:'IBM Plex Mono', monospace;font-size:12px;}
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .dot-pulse{
    display:inline-block;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.3;}
    50%{opacity:1;}
  }

  /* TABS */
  .admin-tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .admin-tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.4px;
    color:var(--ink-soft);
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:10px 4px;
    margin-right:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:color .15s ease, border-color .15s ease;
  }
  .admin-tab:hover{color:var(--ink);}
  .admin-tab.active{color:var(--accent);border-color:var(--accent);}
  .admin-tab .count-pill{
    background:var(--paper-2);border:1px solid var(--line);border-radius:999px;
    padding:1px 7px;font-size:10.5px;color:var(--ink-soft);
  }
  .admin-tab.active .count-pill{background:rgba(14,169,104,.1);border-color:rgba(14,169,104,.3);color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;letter-spacing:.4px;
    border-radius:5px;padding:2.5px 7px;display:inline-block;font-weight:600;
  }
  .badge.ok{color:#0E9968;background:rgba(16,185,129,.1);}
  .badge.warn{color:#B45309;background:rgba(217,119,6,.1);}
  .badge.fail{color:#B91C1C;background:rgba(220,38,38,.1);}
  .badge.neutral{color:var(--ink-soft);background:var(--paper-2);}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1 class="brand-mark">
        <span class="brand-badge">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 15.5L9.5 10L13 13L20 5.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14.5 5H20V10.5" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-text">Build<span class="accent">ItUp</span></span>
        <span class="brand-suffix">/ Admin</span>
      </h1>
      <div class="tag">Waitlist &amp; engagement dashboard</div>
    </div>
    <button id="logout">Log out</button>
  </div>

  <!-- LOGIN -->
  <div class="login-card" id="loginCard">
    <h2>Enter admin password</h2>
    <p>Access to waitlist signups and site analytics. This page isn't linked publicly.</p>
    <div class="pw-row">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="off">
      <button class="toggle-eye" id="toggleEye" type="button">show</button>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="remember">
      <label for="remember">Keep me signed in on this device</label>
    </div>
    <button class="primary" id="load">Load dashboard</button>
    <div id="msg"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="stats" id="statsRow"></div>

    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="users">Users <span class="count-pill" id="count-users">0</span></button>
      <button class="admin-tab" data-tab="logins">Login activity <span class="count-pill" id="count-logins">0</span></button>
      <button class="admin-tab" data-tab="waitlist">Waitlist <span class="count-pill" id="count-waitlist">0</span></button>
    </div>

    <div class="tab-panel active" id="panel-users">
      <div class="table-card">
        <div class="table-head">
          <h3>Registered accounts</h3>
          <input id="search-users" type="text" placeholder="Search name or email...">
        </div>
        <div class="table-scroll" id="usersTableWrap"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-logins">
      <div class="table-card">
        <div class="table-head">
          <h3>Login attempts — password, code, and magic-link sign-ins</h3>
          <input id="search-logins" type="text" placeholder="Search email...">
        </div>
        <div class="table-scroll" id="loginsTableWrap"></div>
      </div>
    </div>

    <div class="tab-panel" id="panel-waitlist">
      <div class="table-card">
        <div class="table-head">
          <h3>Waitlist signups</h3>
          <input id="search-waitlist" type="text" placeholder="Search email or role...">
        </div>
        <div class="table-scroll" id="waitlistTableWrap"></div>
      </div>
    </div>
  </div>

</div>

<script>
const WORKER_URL = "https://projectdesk-api.aryadeepbiswas014.workers.dev";
let allUsers = [];
let allLogins = [];
let allWaitlist = [];

const pwInput = document.getElementById('pw');
const loadBtn = document.getElementById('load');
const msg = document.getElementById('msg');
const loginCard = document.getElementById('loginCard');
const dashboard = document.getElementById('dashboard');
const logoutBtn = document.getElementById('logout');
const toggleEye = document.getElementById('toggleEye');

toggleEye.addEventListener('click', () => {
  const showing = pwInput.type === 'text';
  pwInput.type = showing ? 'password' : 'text';
  toggleEye.textContent = showing ? 'show' : 'hide';
});

pwInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadBtn.click();
});

// ---- Tabs ----
document.querySelectorAll('.admin-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

async function loadDashboard(password) {
  msg.innerHTML = '<div class="error-msg" style="color:var(--ink-soft);"><span class="dot-pulse">●</span> Authenticating...</div>';
  loadBtn.disabled = true;

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'admin_dashboard', password })
    });
    const data = await res.json();

    if (data.error) {
      msg.innerHTML = `<div class="error-msg">⚠ ${data.error}</div>`;
      loadBtn.disabled = false;
      sessionStorage.removeItem('pd_admin_pw');
      localStorage.removeItem('pd_admin_pw');
      return;
    }

    if (document.getElementById('remember').checked) {
      localStorage.setItem('pd_admin_pw', password);
    } else {
      sessionStorage.setItem('pd_admin_pw', password);
    }

    msg.innerHTML = '';
    loadBtn.disabled = false;
    renderDashboard(data);
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
  } catch (err) {
    msg.innerHTML = '<div class="error-msg">⚠ Could not reach the server. Try again.</div>';
    loadBtn.disabled = false;
  }
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + 'd ago';
}

function renderDashboard(data) {
  allUsers = data.users || [];
  allLogins = data.logins || [];
  allWaitlist = data.waitlist || [];
  const loginStats = data.loginStats || {};
  const userStats = data.userStats || {};
  const counts = data.eventCounts || {};
  const views = counts.landing_view || 0;
  const clicks = counts.cta_click || 0;
  const rate = views ? ((clicks / views) * 100).toFixed(1) : '0';

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="num">${userStats.total || 0}</div><div class="lbl">Registered users</div></div>
    <div class="stat-box"><div class="num">${loginStats.total || 0}</div><div class="lbl">Total logins (90d)</div></div>
    <div class="stat-box"><div class="num">${loginStats.today || 0}</div><div class="lbl">Logins today</div></div>
    <div class="stat-box"><div class="num">${loginStats.failed || 0}</div><div class="lbl">Failed attempts</div></div>
    <div class="stat-box"><div class="num">${userStats.verified || 0}</div><div class="lbl">Verified emails</div></div>
    <div class="stat-box"><div class="num">${views}</div><div class="lbl">Landing views</div></div>
    <div class="stat-box"><div class="num">${rate}%</div><div class="lbl">Click-through rate</div></div>
    <div class="stat-box"><div class="num">${allWaitlist.length}</div><div class="lbl">Waitlist signups</div></div>
  `;

  document.getElementById('count-users').textContent = allUsers.length;
  document.getElementById('count-logins').textContent = allLogins.length;
  document.getElementById('count-waitlist').textContent = allWaitlist.length;

  renderUsersTable(allUsers);
  renderLoginsTable(allLogins);
  renderWaitlistTable(allWaitlist);
}

function renderUsersTable(users) {
  const wrap = document.getElementById('usersTableWrap');
  if (!users.length) { wrap.innerHTML = '<div class="empty-state">No registered accounts yet.</div>'; return; }
  let html = '<table><tr><th>Signed up</th><th>Name</th><th>Email</th><th>Plan</th><th>Credits</th><th>Verified</th><th>Guides unlocked</th></tr>';
  users.forEach(u => {
    html += `<tr>
      <td>${new Date(u.signedUpAt).toLocaleString()} <span style="color:var(--ink-soft);">(${timeAgo(u.signedUpAt)})</span></td>
      <td>${u.name || ''}</td>
      <td class="email">${u.email || ''}</td>
      <td><span class="badge ${u.plan === 'premium' ? 'ok' : 'neutral'}">${u.plan || 'free'}</span></td>
      <td>${u.credits ?? ''}</td>
      <td><span class="badge ${u.emailVerified ? 'ok' : 'warn'}">${u.emailVerified ? 'verified' : 'unverified'}</span></td>
      <td>${u.guidesUnlocked ?? 0}</td>
    </tr>`;
  });
  html += '</table>';
  wrap.innerHTML = html;
}

function renderLoginsTable(logins) {
  const wrap = document.getElementById('loginsTableWrap');
  if (!logins.length) { wrap.innerHTML = '<div class="empty-state">No login activity recorded yet.</div>'; return; }
  let html = '<table><tr><th>When</th><th>Email</th><th>Method</th><th>Result</th><th>Reason</th></tr>';
  logins.forEach(l => {
    html += `<tr>
      <td>${new Date(l.ts).toLocaleString()} <span style="color:var(--ink-soft);">(${timeAgo(l.ts)})</span></td>
      <td class="email">${l.email || ''}</td>
      <td><span class="badge neutral">${(l.method || '').replace('_', ' ')}</span></td>
      <td><span class="badge ${l.success ? 'ok' : 'fail'}">${l.success ? 'success' : 'failed'}</span></td>
      <td style="color:var(--ink-soft);">${l.reason ? l.reason.replace(/_/g, ' ') : '—'}</td>
    </tr>`;
  });
  html += '</table>';
  wrap.innerHTML = html;
}

function renderWaitlistTable(entries) {
  const wrap = document.getElementById('waitlistTableWrap');
  if (!entries.length) { wrap.innerHTML = '<div class="empty-state">No matching signups yet.</div>'; return; }
  let html = '<table><tr><th>When</th><th>Email</th><th>Role</th><th>Gap</th><th>Dream Target</th><th>Branch</th><th>Skills</th></tr>';
  entries.forEach(e => {
    html += `<tr>
      <td>${new Date(e.ts).toLocaleString()}</td>
      <td class="email">${e.email || ''}</td>
      <td>${e.role || ''}</td>
      <td>${e.gap || ''}</td>
      <td>${e.dreamTarget || ''}</td>
      <td>${e.branch || ''}</td>
      <td>${e.skills || ''}</td>
    </tr>`;
  });
  html += '</table>';
  wrap.innerHTML = html;
}

document.getElementById('search-users').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderUsersTable(!q ? allUsers : allUsers.filter(u =>
    (u.email || '').toLowerCase().includes(q) || (u.name || '').toLowerCase().includes(q)
  ));
});
document.getElementById('search-logins').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderLoginsTable(!q ? allLogins : allLogins.filter(l => (l.email || '').toLowerCase().includes(q)));
});
document.getElementById('search-waitlist').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderWaitlistTable(!q ? allWaitlist : allWaitlist.filter(e2 =>
    (e2.email || '').toLowerCase().includes(q) || (e2.role || '').toLowerCase().includes(q)
  ));
});

loadBtn.addEventListener('click', () => {
  const password = pwInput.value;
  if (!password) {
    msg.innerHTML = '<div class="error-msg">⚠ Enter a password first.</div>';
    return;
  }
  loadDashboard(password);
});

logoutBtn.addEventListener('click', () => {
  sessionStorage.removeItem('pd_admin_pw');
  localStorage.removeItem('pd_admin_pw');
  dashboard.style.display = 'none';
  loginCard.style.display = 'block';
  logoutBtn.style.display = 'none';
  pwInput.value = '';
});

// Auto-login if a saved password exists
const savedPw = localStorage.getItem('pd_admin_pw') || sessionStorage.getItem('pd_admin_pw');
if (savedPw) {
  pwInput.value = savedPw;
  loadDashboard(savedPw);
}
</script>
</body>
</html>
