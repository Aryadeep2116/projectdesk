<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ProjectDesk — Admin</title>
<style>
  body{font-family:Arial,sans-serif;background:#1A241F;color:#E7E3D6;padding:40px;max-width:900px;margin:0 auto;}
  h1{font-size:22px;}
  input{padding:10px;border-radius:4px;border:1px solid #444;background:#20281F;color:#fff;width:260px;margin-right:8px;}
  button{padding:10px 18px;border-radius:4px;border:none;background:#B8862E;color:#1A241F;cursor:pointer;font-weight:bold;}
  table{width:100%;border-collapse:collapse;margin-top:24px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #333;font-size:13px;}
  th{color:#B8862E;text-transform:uppercase;font-size:11px;letter-spacing:1px;}
  .stats{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
  .stat-box{background:#20281F;border:1px solid #333;border-radius:8px;padding:14px 20px;min-width:140px;}
  .stat-box .num{font-size:28px;font-weight:bold;color:#B8862E;}
  .stat-box .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8B948A;margin-top:4px;}
  .error{color:#E07A5F;margin-top:12px;}
</style>
</head>
<body>
  <h1>ProjectDesk — Waitlist Admin</h1>
  <div>
    <input id="pw" type="password" placeholder="Admin password">
    <button id="load">Load waitlist</button>
  </div>
  <div id="msg"></div>
  <div id="out"></div>

<script>
const WORKER_URL = "https://projectdesk-api.aryadeepbiswas014.workers.dev";

document.getElementById('load').addEventListener('click', async () => {
  const password = document.getElementById('pw').value;
  const msg = document.getElementById('msg');
  const out = document.getElementById('out');
  msg.textContent = 'Loading...';
  msg.className = '';
  out.innerHTML = '';

  try{
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'admin_view_waitlist', password })
    });
    const data = await res.json();
    if(data.error){
      msg.textContent = data.error;
      msg.className = 'error';
      return;
    }
    msg.textContent = '';
    const entries = data.entries || [];
    const counts = data.eventCounts || {};
    const views = counts.landing_view || 0;
    const clicks = counts.cta_click || 0;
    const rate = views ? ((clicks / views) * 100).toFixed(1) : '0';

    document.getElementById('msg').innerHTML = `
      <div class="stats">
        <div class="stat-box"><div class="num">${views}</div><div class="lbl">Landing views</div></div>
        <div class="stat-box"><div class="num">${clicks}</div><div class="lbl">CTA clicks</div></div>
        <div class="stat-box"><div class="num">${rate}%</div><div class="lbl">Click-through rate</div></div>
        <div class="stat-box"><div class="num">${entries.length}</div><div class="lbl">Waitlist signups</div></div>
      </div>
    `;

    if(entries.length === 0){
      out.textContent = 'No signups yet.';
      return;
    }

    let html = '<table><tr><th>When</th><th>Email</th><th>Role</th><th>Gap</th><th>Dream Target</th><th>Branch</th><th>Skills</th></tr>';
    entries.forEach(e => {
      html += `<tr>
        <td>${new Date(e.ts).toLocaleString()}</td>
        <td>${e.email || ''}</td>
        <td>${e.role || ''}</td>
        <td>${e.gap || ''}</td>
        <td>${e.dreamTarget || ''}</td>
        <td>${e.branch || ''}</td>
        <td>${e.skills || ''}</td>
      </tr>`;
    });
    html += '</table>';
    out.innerHTML = html;
  } catch(err){
    msg.textContent = 'Failed to load. Check the password or try again.';
    msg.className = 'error';
  }
});
</script>
</body>
</html>
